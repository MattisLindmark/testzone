<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937">
    <meta name="description" content="Enkel app för att logga hälsodata lokalt">
    
    <title>HealthLogMD</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="app" class="app-container"></div>
    
    <script src="/js/dateUtils.js"></script>
    <script src="/js/markdownParser.js"></script>
    <script src="/js/indexedDBService.js"></script>
    <script src="/js/fileService.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => {
                console.error('SW registration failed:', err);
            });
        }
    </script>
</body>
</html>
